name: CI

# Runs on every push and pull request. Nothing here contacts Postgres, HANA or
# SAP: the suite uses OMS/test_settings.py (in-memory SQLite, migrations
# skipped) and every outbound call in the tests is mocked.
on:
  push:
  pull_request:

concurrency:
  # A second push to the same branch cancels the first — the older result is
  # about to be irrelevant, and these runners are shared.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the version the project is developed against. If a pinned
          # dependency has no wheel for this version, pip falls back to a
          # source build — hence the apt packages below.
          python-version: '3.14'
          cache: pip

      - name: Install build dependencies for source-built wheels
        # psycopg2-binary and pymssql ship wheels for most versions but not
        # always the newest; these let pip build them rather than fail the run.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Write a bootable .env
        # This step IS a test. `cp .env.example .env` must produce a file the
        # app can start from — if a setting is added to settings.py without a
        # default and without an entry in the example file, this run fails
        # here, on the branch that added it, rather than on a server at deploy.
        #
        # The three generated secrets are minted per run instead of committed:
        # SECRET_KEY signs every JWT, and a shared VAPID private key would let
        # anyone push notifications to this app's subscribers.
        run: python scripts/write_ci_env.py

      - name: Django system checks
        # DEBUG is false (from .env.example), so this runs the production
        # configuration — the security headers, ALLOWED_HOSTS and CORS
        # settings are all under `if not DEBUG`.
        run: python manage.py check --settings=OMS.test_settings

      - name: Models and migrations agree
        # Catches the change that edits a model and forgets `makemigrations`.
        # The test suite CANNOT catch this: test_settings.py disables the
        # migration executor and builds the schema straight from the models,
        # so a missing migration passes every test and then fails on deploy.
        run: python manage.py makemigrations --check --dry-run --settings=OMS.test_settings

      - name: Test suite
        run: python manage.py test --settings=OMS.test_settings --verbosity=2

      - name: OpenAPI schema generates and validates
        # A view that breaks generation breaks it for EVERY view — the command
        # produces one document or none — so this is worth its own step rather
        # than being folded into the suite, where the failure would read as
        # "one test failed".
        #
        # Not --fail-on-warn: there is a real backlog of views that build their
        # Response by hand and so have no describable body. The suite tracks
        # that count and fails when it grows; blocking on it here would gate
        # every change on a pre-existing backlog instead.
        run: |
          python manage.py spectacular             --settings=OMS.test_settings             --validate --file /tmp/openapi-schema.yml

      - name: Upload the schema
        # Makes the generated contract downloadable from the run, so a reviewer
        # can diff what an API change did without running anything.
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: /tmp/openapi-schema.yml
