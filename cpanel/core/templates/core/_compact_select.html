{% comment %}
  CompactSelect — our own dropdown list for <select class="csel">.

  A browser's native <select> popup cannot be sized or styled, and on the
  Expenses / Salary filters it opened as a huge OS list. CompactSelect.upgrade(sel)
  keeps the real <select> in the page (hidden, still the source of truth) and
  puts a styled button + list in front of it:

    * picking an option sets select.value and fires a real `change` event, so
      every existing onchange="..." handler and every `.value` read keeps working;
    * the list is rebuilt from the select's CURRENT options each time it opens,
      so options added later (initPeriodControls fills Month/Year) are picked up;
    * a programmatic `select.value = x` is reflected via CompactSelect.sync(sel).

  Keyboard: Enter/Space/ArrowDown open, arrows move, Enter picks, Escape closes.

  Recreated: this file was excluded by the `_*.html` rule in .gitignore and so
  never reached the repository.
{% endcomment %}
<style>
  .csel-wrap { position: relative; width: 100%; }
  .csel-wrap > select.csel { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .csel-btn {
    width: 100%; min-height: 40px; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px 12px; border: 1px solid #dbe3f0; border-radius: 10px; background: #fff;
    font: inherit; font-size: 14px; color: #1f2937; cursor: pointer; text-align: left;
  }
  .csel-btn:focus-visible { outline: 2px solid #635bff; outline-offset: 1px; }
  .csel-btn::after { content: '\25BE'; font-size: 12px; color: #64748b; }
  .csel-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .csel-list {
    position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px;
    list-style: none; max-height: 240px; overflow-y: auto; background: #fff; border: 1px solid #dbe3f0;
    border-radius: 10px; box-shadow: 0 10px 30px rgba(15, 23, 42, .12); display: none;
  }
  .csel-wrap.open .csel-list { display: block; }
  .csel-list li { padding: 7px 10px; border-radius: 7px; font-size: 13.5px; color: #1f2937; cursor: pointer; }
  .csel-list li[aria-selected="true"] { background: #eef0ff; color: #4338ca; font-weight: 600; }
  .csel-list li.active, .csel-list li:hover { background: #f1f5f9; }
  .csel-list li[aria-disabled="true"] { color: #94a3b8; cursor: default; }
</style>
<script>
window.CompactSelect = window.CompactSelect || (function () {
  var uid = 0;

  function label(sel) {
    var opt = sel.options[sel.selectedIndex];
    return opt ? opt.text : '';
  }

  function sync(sel) {
    var w = sel._csel;
    if (w) w.btn.firstChild.textContent = label(sel);
  }

  function close(sel) {
    var w = sel._csel;
    if (!w || !w.wrap.classList.contains('open')) return;
    w.wrap.classList.remove('open');
    w.btn.setAttribute('aria-expanded', 'false');
  }

  function pick(sel, index) {
    var opt = sel.options[index];
    if (!opt || opt.disabled) return;
    var changed = sel.selectedIndex !== index;
    sel.selectedIndex = index;
    sync(sel);
    close(sel);
    sel._csel.btn.focus();
    if (changed) sel.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function setActive(sel, index) {
    var items = sel._csel.list.children;
    for (var i = 0; i < items.length; i++) items[i].classList.toggle('active', i === index);
    if (items[index]) items[index].scrollIntoView({ block: 'nearest' });
    sel._csel.active = index;
  }

  function open(sel) {
    var w = sel._csel;
    w.list.innerHTML = '';
    Array.prototype.forEach.call(sel.options, function (opt, i) {
      var li = document.createElement('li');
      li.id = w.id + '-o' + i;
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', i === sel.selectedIndex ? 'true' : 'false');
      if (opt.disabled) li.setAttribute('aria-disabled', 'true');
      li.textContent = opt.text;
      li.addEventListener('mousedown', function (e) { e.preventDefault(); pick(sel, i); });
      w.list.appendChild(li);
    });
    w.wrap.classList.add('open');
    w.btn.setAttribute('aria-expanded', 'true');
    setActive(sel, Math.max(0, sel.selectedIndex));
  }

  function upgrade(sel) {
    if (!sel || sel._csel || sel.tagName !== 'SELECT') return;
    var id = 'csel' + (++uid);
    var wrap = document.createElement('div');
    wrap.className = 'csel-wrap';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    sel.tabIndex = -1;
    sel.setAttribute('aria-hidden', 'true');

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'csel-btn';
    btn.setAttribute('aria-haspopup', 'listbox');
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-controls', id);
    var lbl = sel.id && document.querySelector('label[for="' + sel.id + '"]');
    var near = sel.closest('.fg') && sel.closest('.fg').querySelector('label');
    var name = (lbl || near) ? (lbl || near).textContent.trim() : '';
    if (name) btn.setAttribute('aria-label', name);
    btn.appendChild(document.createElement('span'));
    wrap.appendChild(btn);

    var list = document.createElement('ul');
    list.id = id;
    list.className = 'csel-list';
    list.setAttribute('role', 'listbox');
    wrap.appendChild(list);

    sel._csel = { wrap: wrap, btn: btn, list: list, id: id, active: 0 };
    sync(sel);
    sel.addEventListener('change', function () { sync(sel); });

    btn.addEventListener('click', function () {
      if (wrap.classList.contains('open')) close(sel); else open(sel);
    });
    btn.addEventListener('keydown', function (e) {
      var isOpen = wrap.classList.contains('open');
      var w = sel._csel;
      if (!isOpen && (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault(); open(sel); return;
      }
      if (!isOpen) return;
      if (e.key === 'Escape') { e.preventDefault(); close(sel); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); setActive(sel, Math.min(sel.options.length - 1, w.active + 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(sel, Math.max(0, w.active - 1)); }
      else if (e.key === 'Home') { e.preventDefault(); setActive(sel, 0); }
      else if (e.key === 'End') { e.preventDefault(); setActive(sel, sel.options.length - 1); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(sel, w.active); }
      else if (e.key === 'Tab') { close(sel); }
    });
    btn.addEventListener('blur', function () { setTimeout(function () { close(sel); }, 120); });
  }

  document.addEventListener('click', function (e) {
    document.querySelectorAll('.csel-wrap.open').forEach(function (w) {
      if (!w.contains(e.target)) {
        w.classList.remove('open');
        w.querySelector('.csel-btn').setAttribute('aria-expanded', 'false');
      }
    });
  });

  return { upgrade: upgrade, sync: sync };
})();
</script>
