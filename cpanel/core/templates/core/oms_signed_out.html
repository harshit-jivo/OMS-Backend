<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Panel</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f9;
           font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2937; }
    .card { max-width: 420px; margin: 16px; padding: 28px 28px 24px; background: #fff;
            border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0; font-size: 14px; line-height: 1.5; color: #4b5563; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Control Panel</h1>
    <p>{{ reason }} Use <strong>Reload</strong> in the OMS top bar, or open the page again from the OMS sidebar.</p>
  </div>
</body>
</html>
