{% extends base_template %}
{% block title %}Person Mapping & Targets - Realise{% endblock %}

{% block extra_styles %}
<style>
  /* Single scroll: pin the dashboard content area and let the iframe fill it. The
     React app (incl. its Back button) scrolls inside — one scrollbar, header scrolls
     with the content. The base top bar is 56px tall. */
  body.pt-page .cp-main { padding: 0; overflow: hidden; height: calc(100vh - 56px); }
  .pt-frame { width: 100%; height: 100%; border: 0; display: block; background: #f1f5f9; }
</style>
{% endblock %}

{% block content %}
<iframe class="pt-frame" src="{% url 'realise:person_targets_embed' %}" title="Person Mapping & Targets"></iframe>
<script>document.body.classList.add('pt-page');</script>
{% endblock %}
